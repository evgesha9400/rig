[project]
name = "rig"
version = "0.2.0"
description = "Zero-dependency local dev environment and process runner with dynamic port allocation, socket inheritance, and verified lifecycle management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rig = "rig.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

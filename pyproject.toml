[project]
name = "rig"
version = "0.2.0"
description = "Zero-dependency local dev environment and process runner with dynamic port allocation, socket inheritance, and verified lifecycle management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
    "import-linter>=2.0",
    "grimp>=3.0",
    "pylint>=3.0.0",
    "deptry>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rig = "rig.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.deptry]
known_first_party = ["rig"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["scripts"]

[tool.pylint.format]
max-module-lines = 150

[tool.pylint.design]
max-nested-blocks = 2
